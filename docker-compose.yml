# Jam Gym on the production server, next to eardle.
#
# It is its own Compose project (`name: jam-gym`), so its containers, network, image and volume are separate from
# eardle's, and `docker compose` commands run in this folder can never touch eardle's containers.
# Use `docker compose -f docker-compose.yml ...` (as with eardle); there is no override file here.
name: jam-gym

services:
  web:
    build: .
    restart: always
    ports:
      # Loopback only: the host nginx proxies jam-gym.eardle.com to this. (eardle uses 127.0.0.1:3000.)
      # This also is what makes TRUST_PROXY safe: only that nginx can reach the container.
      - "127.0.0.1:3100:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      TRUST_PROXY: "1"
      BACKUPS: "1"
      DATA_DIR: /data
    volumes:
      # Tracks, likes and daily backups. Do NOT prune this volume: `docker volume prune` would delete every user's tracks.
      - data:/data
    # Small Node process. Capped so it can never crowd out eardle on the shared host.
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
