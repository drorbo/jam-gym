# Host nginx config for https://jam-gym.eardle.com
#
# Install on the server as a NEW file next to eardle's (never edit eardle.com.conf for this):
#   /etc/nginx/sites-available/jam-gym.eardle.com.conf
#   ln -s ... /etc/nginx/sites-enabled/jam-gym.eardle.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
# See docs/deployment.md.
#
# Same layout as eardle's config: HTTP redirects to HTTPS; TLS terminates here on the host;
# everything is proxied to the Docker container, which listens on 127.0.0.1:3100.
# The certificate is the existing Cloudflare Origin certificate, which covers *.eardle.com.

# Redirect all HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name jam-gym.eardle.com;

    # Allow Let's Encrypt ACME challenge over plain HTTP (same path eardle uses)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jam-gym.eardle.com;

    # SSL: shared with eardle. It is a wildcard (*.eardle.com), so nothing needs to change there.
    ssl_certificate     /etc/nginx/ssl/eardle.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/eardle.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs (own files, so this site never mixes into eardle's)
    access_log /var/log/nginx/jam-gym.eardle.com.access.log;
    error_log  /var/log/nginx/jam-gym.eardle.com.error.log;

    # Proxy everything to the Docker container
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
