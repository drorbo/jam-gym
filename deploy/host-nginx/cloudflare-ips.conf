# Cloudflare's published IP ranges (https://www.cloudflare.com/ips/), so nginx accepts HTTPS connections only from
# Cloudflare's edge, not directly against the origin's public IP. Without this, anyone who knows the server's IP can
# bypass Cloudflare (and every rate limit / bot check it does) and send forged headers like CF-Connecting-IP straight
# to the app, which trusts them (TRUST_PROXY=1). See the 2026-09 audit (SECURITY_AND_BUG_AUDIT.md, finding M-1).
#
# Shared between this site and eardle's (its nginx config is not tracked in a repo; this is the one canonical copy —
# see docs/deployment.md and JAM-GYM-ON-THIS-SERVER.md in the eardle repo). Lives on the server at
# /etc/nginx/cloudflare-ips.conf, included from both sites' :443 server blocks. Port 80 (redirect + ACME challenge) is
# deliberately NOT restricted by it.
#
# To refresh: curl -s https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6, rebuild this file, copy
# it to the server, then `sudo nginx -t && sudo systemctl reload nginx`.

allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;
allow 127.0.0.1;
allow ::1;
deny all;
