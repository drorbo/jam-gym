# nginx INSIDE the jam-gym container: serves the static files.
# TLS, the public hostname and security headers are handled by the host nginx
# (see deploy/host-nginx/jam-gym.eardle.com.conf), exactly like eardle.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Text only. WAV files barely compress, and gzipping them would just burn CPU on the shared server.
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # Code and pages have fixed file names, so make browsers revalidate them (cheap: ETag) rather than
    # risk serving a stale mix of old and new modules after a deploy.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Fonts and recorded samples are large and rarely change: let browsers keep them for a day.
    # (samples/manifest.json is not under drums/ or keys/, so it still revalidates.)
    location ~ ^/(fonts|samples/drums|samples/keys)/ {
        try_files $uri =404;
        default_type audio/wav;   # nginx's mime.types has no .wav entry; fonts keep their own known type
        add_header Cache-Control "public, max-age=86400";
    }

    # The credits file is markdown; show it as text instead of downloading it.
    location ~ \.md$ {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
